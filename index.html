<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPP Nusantara Museum Tour</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles/style.css" />
  </head>

  <body class="bg-gray-900 m-0 overflow-hidden relative">
    <div id="blocker" class="absolute inset-0 z-[99]">
      <div
        id="instructions"
        class="absolute inset-0 bg-[#daf6ff] text-black flex flex-col justify-center items-center text-center font-sans z-[100]"
      >
        <h1 class="text-4xl md:text-5xl font-bold title-font drop-shadow-lg">
          Selamat Datang
        </h1>
        <h2 class="title-font text-2xl mt-2">
          Di Tur Museum Virtual Nusantara
        </h2>

        <div
          class="bg-white/60 backdrop-blur-md px-6 my-6 py-4 rounded-xl shadow-md max-w-lg"
        >
          <p class="text-xl font-semibold mb-2 title-font">Petunjuk:</p>

          <p class="text-lg">WASD untuk Bergerak</p>
          <p class="text-lg">Mouse untuk Melihat Sekitar</p>
          <p class="text-lg">
            ESC untuk keluar (kembali ke halaman ini kapan saja)
          </p>
        </div>

        <h2
          class="text-2xl md:text-3xl font-semibold drop-shadow animate-bounce cursor-pointer title-font"
        >
          Klik untuk Memulai
        </h2>

        <button
          id="settings-btn"
          class="absolute top-5 right-5 z-[101] text-white bg-black/50 p-3 rounded-full hover:bg-black/80 transition"
        >
          ⚙️ Settings
        </button>

        <img
          src="src/assets/instructions/asset-left.png"
          alt="asset-left"
          class="absolute left-0 w-1/3 bottom-0"
        />
        <img
          src="src/assets/instructions/asset-right.png"
          alt="asset-right"
          class="absolute right-0 w-1/3 bottom-0"
        />
        <img
          src="src/assets/instructions/awan-left.png"
          alt="awan-left"
          class="absolute left-0 w-1/3 top-0"
        />
        <img
          src="src/assets/instructions/awan-right.png"
          alt="awan-right"
          class="absolute right-0 w-1/3 top-0"
        />
      </div>
    </div>

    <div
      id="crosshair"
      class="absolute top-1/2 left-1/2 w-[5px] h-[5px] -mt-[2.5px] -ml-[2.5px] bg-white rounded-full z-10"
    ></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
        }
      }
    </script>

    <div
      id="exhibit-modal-container"
      class="fixed inset-0 hidden flex justify-center items-center z-[1000]"
    >
      <div
        class="relative bg-[#f4e4bc] p-8 rounded border-4 double border-[#8b4513] w-[80%] max-w-[600px] max-h-[90vh] overflow-y-auto shadow-[0_0_30px_rgba(139,69,19,0.3)] font-['Playfair_Display']"
        style="
          background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.15%22/%3E%3C/svg%3E');
          background-blend-mode: multiply;
        "
      >
        <div class="border-b-2 border-[#8b4513]/30 pb-4 mb-4 text-center">
          <h3
            class="text-2xl font-bold text-[#5d2e0d] uppercase tracking-widest"
          >
            Keterangan Artefak
          </h3>
        </div>

        <div
          id="exhibit-modal-content"
          class="text-[#3e2723] text-lg leading-relaxed"
        >
          <p>This is where the story about the artifact goes.</p>
        </div>

        <div class="mt-8 text-center border-t-2 border-[#8b4513]/30 pt-4">
          <button
            onclick="window.closeExhibitModal()"
            class="px-8 py-2 bg-[#8b4513] text-[#f4e4bc] font-bold uppercase tracking-widest text-sm hover:bg-[#6d360f] transition transform hover:scale-105 shadow-md border border-[#5d2e0d]"
          >
            Tutup
          </button>
        </div>
      </div>
    </div>

    <!-- Inspect Mode Modal -->
    <div
      id="inspect-modal-container"
      class="fixed inset-0 hidden z-[1001] bg-black"
    >
      <div id="inspect-3d-container" class="w-full h-full relative"></div>

      <div
        class="absolute top-10 left-1/2 -translate-x-1/2 text-white text-center"
      >
        <h2 id="inspect-title" class="text-3xl font-bold"></h2>
        <p id="inspect-subtitle" class="text-sm italic mt-2"></p>
      </div>

      <button
        id="inspect-audio-btn"
        class="absolute bottom-10 left-1/2 -translate-x-1/2 hidden px-6 py-3 bg-white/20 backdrop-blur text-white rounded-lg hover:bg-white/30 transition"
      >
        🔊 Play Sound
      </button>

      <button
        onclick="window.closeInspectMode()"
        class="absolute bottom-10 right-10 px-4 py-2 bg-white/20 backdrop-blur text-white rounded-lg hover:bg-white/30 transition"
      >
        Exit
      </button>

      <p class="absolute bottom-10 left-10 text-white/70 text-sm">
        Drag to Rotate
      </p>
    </div>

    <div
      id="settings-modal"
      class="hidden absolute inset-0 z-[102] bg-black/80 flex justify-center items-center"
    >
      <div
        class="bg-white p-8 rounded-xl max-w-sm w-full text-center font-sans"
      >
        <h2 class="text-2xl font-bold mb-6 text-gray-800">Settings</h2>

        <div class="mb-6">
          <label
            for="volume-slider"
            class="block text-lg font-semibold mb-2 text-gray-700"
            >Master Volume</label
          >
          <input
            id="volume-slider"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.5"
            class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
          />
          <div class="flex justify-between text-sm text-gray-500 mt-1">
            <span>0%</span>
            <span>100%</span>
          </div>
        </div>

        <button
          id="close-settings"
          class="px-6 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition"
        >
          Close
        </button>
      </div>
    </div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
